<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResolveHQ Test Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: slim top bar, then customer portal (left) and company console (right) side by side; tabs on narrow screens. */
  :root{
    --bg:#E7EBF2; --bar:#151B27; --bar-fg:#E9EDF4; --bar-muted:#9AA5B8; --pane:#FFFFFF; --line:#CFD6E2;
    --teal:#0E8C8C; --amber:#C77B30; --flash:#F4C46A;
    --font-display:"Space Grotesk","Segoe UI",system-ui,sans-serif; --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E131B; --line:#2B3443; color-scheme:dark } }
  :root[data-theme="dark"]{ --bg:#0E131B; --line:#2B3443; color-scheme:dark }
  html,body{height:100%}
  body{background:var(--bg);font-family:var(--font-body);margin:0;display:flex;flex-direction:column;overflow:hidden}
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--bar);color:var(--bar-fg)}
  .brand{font-family:var(--font-display);font-weight:600;font-size:15px;white-space:nowrap}
  .brand span{color:var(--bar-muted);font-weight:500;font-family:var(--font-body);margin-left:6px;font-size:12.5px}
  .hint{font-size:12.5px;color:var(--bar-muted);flex:1;min-width:220px}
  .hint b{color:var(--bar-fg);font-weight:600}
  .reset{background:transparent;color:var(--bar-fg);border:1px solid #3A4558;border-radius:8px;padding:6px 11px;font:600 12.5px var(--font-body);cursor:pointer}
  .reset:hover{background:#222B3A}
  .reset:focus-visible,.tab:focus-visible{outline:2px solid var(--flash);outline-offset:2px}
  .tabs{display:none;gap:6px;padding:8px 16px 0;background:var(--bg)}
  .tab{flex:1;border:1px solid var(--line);background:var(--pane);border-radius:9px 9px 0 0;padding:8px;font:600 13px var(--font-body);cursor:pointer;color:#3D4658;position:relative}
  .tab[aria-selected="true"]{border-bottom-color:transparent}
  .tab .dot{position:absolute;top:6px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
  .tab .dot[hidden]{display:none}
  .panes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 16px 16px;min-height:0}
  .pane{display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--pane);transition:box-shadow .3s}
  .pane.flash{box-shadow:0 0 0 3px var(--flash)}
  .pane-h{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--line);color:#3D4658;background:#F7F9FC}
  .pane-h i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .pane-h small{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;color:#69748A;font-size:12px}
  iframe{flex:1;width:100%;border:0;min-height:0;background:#EDF0F6}
  @media (max-width:900px){
    .tabs{display:flex}
    .panes{grid-template-columns:1fr;padding-top:0}
    .pane{border-top-left-radius:0;border-top-right-radius:0}
    .pane:not(.active){display:none}
    .pane-h{display:none}
  }
  @media (prefers-reduced-motion:reduce){.pane{transition:none}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand">ResolveHQ <span>test bench · sample data</span></div>
  <div class="hint">Raise an issue on the left as <b>demo@client.com</b>, then review it on the right as <b>admin@finnoto.com</b>. Password for both: <b>demo1234</b>.</div>
  <button class="reset" id="resetBtn" type="button">Reset demo</button>
</div>
<div class="tabs" role="tablist">
  <button class="tab" id="tab-cust" role="tab" aria-selected="true" type="button">Customer portal<span class="dot" id="dot-cust" hidden></span></button>
  <button class="tab" id="tab-co" role="tab" aria-selected="false" type="button">Company console<span class="dot" id="dot-co" hidden></span></button>
</div>
<div class="panes">
  <section class="pane active" id="pane-cust">
    <div class="pane-h"><i style="background:var(--teal)"></i>Customer portal<small>what your client sees</small></div>
    <iframe id="f-cust" title="Customer portal"></iframe>
  </section>
  <section class="pane" id="pane-co">
    <div class="pane-h"><i style="background:var(--amber)"></i>Company console<small>what your team sees</small></div>
    <iframe id="f-co" title="Company console"></iframe>
  </section>
</div>

  const pane={cust:document.getElementById('pane-cust'), co:document.getElementById('pane-co')};
  const narrow=()=>window.matchMedia('(max-width:900px)').matches;
  function flash(key){
    const p=pane[key]; p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); setTimeout(()=>p.classList.remove('flash'),1600);
    if(narrow() && !p.classList.contains('active')) document.getElementById('dot-'+key).hidden=false;
  }
  // a portal saved something: let the other one pick it up right away
  window.__rhqChanged = function(src){
    [[fc,'cust'],[fo,'co']].forEach(([f,key])=>{
      if(f.contentWindow && f.contentWindow!==src){ try{ f.contentWindow.__rhqExternalChange && f.contentWindow.__rhqExternalChange(); }catch(e){} flash(key); }
    });
  };
  function show(key){
    ['cust','co'].forEach(k=>{ const on=k===key; pane[k].classList.toggle('active',on); document.getElementById('tab-'+k).setAttribute('aria-selected',on); if(on) document.getElementById('dot-'+k).hidden=true; });
  }
  document.getElementById('tab-cust').addEventListener('click',()=>show('cust'));
  document.getElementById('tab-co').addEventListener('click',()=>show('co'));
  document.getElementById('resetBtn').addEventListener('click',()=>{
    try{ fc.contentWindow.__resetDemo(); }catch(e){ location.reload(); }
  });
})();
